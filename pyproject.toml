[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bold-viewer"
version = "0.1.0"
description = "Interactive NIfTI and FSL FEAT viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "pyqtgraph>=0.13.3", "nibabel>=5", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["build", "pytest>=7"]

[project.scripts]
call_viewer = "bold_viewer.viewer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
